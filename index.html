<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Money Era Music Entertainment</title>
    <style>
        body {
            background-color: #111;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
        }
        .logo {
            max-width: 220px;
            height: auto;
            margin-bottom: 25px;
        }
        h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            color: #888;
            font-size: 1.1rem;
            margin-bottom: 35px;
        }
        .links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: #fff;
            color: #000;
            text-decoration: none;
            padding: 15px;
            border-radius: 5px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Links directly to your uploaded image -->
        <img src="MEM Logo.png" alt="Money Era Music Logo" class="logo">

        <h1>Money Era Music</h1>
        <p>Official Record Label & Asset Management Portfolio</p>
        <div class="links">
            <a href="https://mogul.club" class="btn" target="_blank">View Asset Catalog on Mogul</a>
            <a href="mailto:moneyeramusicent@gmail.com" class="btn">Contact / Demos</a>
        </div>
    </div>
</body>
</html>
